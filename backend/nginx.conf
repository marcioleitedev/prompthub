server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    # CORS Headers - permitir tudo
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
    
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Swagger UI - servir arquivos estáticos
    location /api/documentation {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Swagger UI assets (CSS, JS, etc) - DEVE VIR ANTES de /docs
    location /docs/asset {
        alias /var/www/html/vendor/swagger-api/swagger-ui/dist;
        try_files $uri =404;
        expires 1d;
    }

    # Swagger JSON/YAML docs - rota do Laravel
    location /docs {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
